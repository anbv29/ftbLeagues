name = "ftbl"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "ftbl"
# Replace with the database_id printed by `npx wrangler d1 create ftbl`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]
